<p>Organize your photos easily.</p>
<ul>
    <li>Select the folder to organize</li>
    <li>Select options if required
        <ul>
            <li>include Videos</li>
            <li>delete originals</li>
        </ul>
    <li>Press the button <b>Start Organize</b></li>
</ul>
<p>The photos will be stored in your Photos folder (which you can 
    change using the top left button <i><b>tools</b></i>.</p>
